<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1080px;height:1500px;font-family:"PingFang TC","Noto Sans TC",sans-serif;
       background:radial-gradient(120% 90% at 50% 0%,#3d2b1f 0%,#221812 45%,#14100d 100%);
       color:#fff;position:relative;overflow:hidden}
  .glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
  .g1{width:620px;height:620px;background:#c9973f;top:-220px;left:-160px}
  .g2{width:520px;height:520px;background:#7a4fa3;bottom:-200px;right:-140px;opacity:.35}
  .wrap{position:relative;z-index:2;padding:74px 78px 66px;height:100%;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:14px;font-size:26px;letter-spacing:5px;color:#e6c489}
  .top i{display:block;width:60px;height:2px;background:linear-gradient(90deg,#e6c489,transparent)}
  h1{margin-top:44px;font-size:104px;line-height:1.14;letter-spacing:8px;
     background:linear-gradient(100deg,#fff6e2 10%,#f0c877 55%,#e6b25f 90%);
     -webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
  .sub{margin-top:30px;font-size:34px;color:#f3e7d2;letter-spacing:1px;line-height:1.7}
  .sub b{color:#f5cf8d;font-weight:700}
  .name{margin-top:8px;font-size:40px;letter-spacing:4px;color:#fff;font-weight:700}
  .role{margin-top:6px;font-size:27px;color:#cbb79a;letter-spacing:2px}
  .line{height:1px;background:linear-gradient(90deg,transparent,#8d7346,transparent);margin:44px 0 38px}
  .items{display:flex;flex-direction:column;gap:26px}
  .it{display:flex;gap:22px;align-items:flex-start}
  .no{flex:0 0 62px;height:62px;border-radius:50%;border:1.5px solid #c9973f;color:#f0c877;
      display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:700}
  .tx{font-size:29px;line-height:1.55;color:#f6efe2}
  .tx b{color:#f7d294;font-size:31px;display:block;margin-bottom:4px;letter-spacing:1px}
  .res{margin-top:auto;background:rgba(255,255,255,.055);border:1px solid rgba(230,196,137,.28);
       border-radius:18px;padding:26px 30px}
  .res .lb{font-size:23px;letter-spacing:3px;color:#e6c489;margin-bottom:12px}
  .res p{font-size:26px;line-height:1.65;color:#efe6d7}
  .cta{margin-top:26px;display:flex;align-items:center;justify-content:space-between}
  .btn{font-size:30px;font-weight:700;color:#2a1d12;background:linear-gradient(100deg,#f7d294,#e2ab55);
       padding:18px 40px;border-radius:999px;letter-spacing:2px}
  .sig{font-size:23px;color:#b9a68c;letter-spacing:2px;text-align:right;line-height:1.6}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="wrap">
  <div class="top"><i></i>台南應用科技大學校友會 台南分會<i></i></div>
  <h1>發揮所長<br>共好南應</h1>
  <div class="sub">不是一個人的舞台，<br>是一群專業南應人的舞台。</div>
  <div class="name">陳 佩 君</div>
  <div class="role">參選 校友會台南分會 理事長</div>
  <div class="line"></div>
  <div class="items">
    <div class="it"><div class="no">1</div><div class="tx"><b>校友專業職人錄</b>您有需求，找得到校友；您的專業，也讓校友找得到您。</div></div>
    <div class="it"><div class="no">2</div><div class="tx"><b>南應人物光譜 × 故事輯</b>經營粉絲頁、短影音與媒體資源，讓各行各業的南應人被看見。</div></div>
    <div class="it"><div class="no">3</div><div class="tx"><b>《南應大小事》Podcast</b>學長姐分享經驗，學弟妹分享創意，跨世代真正對話。</div></div>
  </div>
  <div class="res">
    <div class="lb">我 能 帶 進 校 友 會 的 資 源</div>
    <p>各社團協會與廠商．AI 百人導師團．業界顧問天團<br>媒體影音資源．BNI 商務團隊</p>
  </div>
  <div class="cta">
    <div class="btn">邀請您回娘家・一起打造</div>
    <div class="sig">音樂系 陳佩君<br>懇請支持參選理事長</div>
  </div>
</div></body></html>
